[project]
name = "ms-fabric-workshop-notebooks"
version = "0.1.0"
description = "Microsoft Fabric Workshop - Notebooks e exemplos práticos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.23.0",
    "pandas>=2.3.0",
    "pyodbc>=5.2.0",
    "ipykernel>=6.29.5",
    "python-dotenv>=1.1.1",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "jupyterlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "jupyterlab>=4.0.0",
]