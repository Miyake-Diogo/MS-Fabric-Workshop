[project]
name = "ms-fabric-workshop"
version = "0.1.0"
description = "Microsoft Fabric Workshop - Coleção de workshops e aplicações demonstrativas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
notebooks = [
    "azure-identity>=1.23.0",
    "pandas>=2.3.0",
    "pyodbc>=5.2.0",
    "ipykernel>=6.29.5",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
